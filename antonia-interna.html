<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ANTONIA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ed; --surface:#ffffff; --border:#e2ddd1;
  --text:#221f1a; --text-dim:#6b6455;
  --accent:#6c5ce7; --accent-ink:#f5f3ff;
  --pill-bg:#eee9fb; --pill-text:#4b3fb3; --pill-border:#d9d2f4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --surface:#1e1c17; --border:#332f26;
    --text:#f1ede3; --text-dim:#a49e8c;
    --accent:#a08bff; --accent-ink:#15102b;
    --pill-bg:#241f3d; --pill-text:#c9befd; --pill-border:#3a3260;
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --surface:#1e1c17; --border:#332f26;
  --text:#f1ede3; --text-dim:#a49e8c;
  --accent:#a08bff; --accent-ink:#15102b;
  --pill-bg:#241f3d; --pill-text:#c9befd; --pill-border:#3a3260;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,Segoe UI,sans-serif; padding:32px;
}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:20px;
  padding:40px; max-width:440px; width:100%; text-align:center;
}
.eyebrow{
  font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--accent);
  font-weight:600; margin-bottom:10px;
}
h1{
  font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:1.7rem;
  margin:0 0 12px; text-wrap:balance; line-height:1.2;
}
p{ color:var(--text-dim); font-size:.92rem; line-height:1.6; margin:0 auto 6px; max-width:38ch; }
button{
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:12px;
  cursor:pointer; font-family:inherit; font-size:1rem; font-weight:600;
  height:52px; padding:0 26px; margin-top:26px; width:100%;
  transition:filter .15s ease, transform .1s ease;
}
button:hover{ filter:brightness(1.08); }
button:active{ transform:scale(0.98); }
button:disabled{ opacity:.6; cursor:default; }
button.active{ background:#d64545; color:#fff5f5; }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
#status{
  margin-top:16px; font-size:.82rem; color:var(--text-dim);
  min-height:1.2em; display:none;
}
.pill{
  display:inline-block; margin-top:18px; padding:5px 14px; border-radius:99px;
  background:var(--pill-bg); color:var(--pill-text); border:1px solid var(--pill-border);
  font-size:.72rem; font-weight:600; letter-spacing:.02em;
}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">TRUCOtechnology · Interno</div>
  <h1>ANTONIA</h1>
  <p>Tu asistente personal. Pregúntale por fiscalidad, clientes, facturación de TruKi o tu agenda — y pídele que te apunte algo si hace falta.</p>
  <button id="voiceBtn" onclick="toggleAntonia()">Hablar con ANTONIA</button>
  <div id="status"></div>
  <div class="pill">Solo para uso interno de TRUCOtechnology</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js" defer></script>
<script>
let antoniaRoom = null;
let antoniaActive = false;

async function toggleAntonia() {
  if (antoniaActive) { endAntonia(); return; }

  const btn = document.getElementById('voiceBtn');
  const status = document.getElementById('status');
  btn.textContent = 'Conectando...';
  btn.disabled = true;
  status.style.display = 'block';
  status.textContent = 'Pidiendo acceso al micrófono...';

  try {
    const resp = await fetch('/.netlify/functions/antonia-token', { method: 'POST' });
    const data = await resp.json();
    if (!data.token) throw new Error(data.error || 'no token');

    const room = new LivekitClient.Room();
    antoniaRoom = room;

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === LivekitClient.Track.Kind.Audio) {
        const el = track.attach();
        el.id = 'antoniaAudio';
        document.body.appendChild(el);
      }
    });
    room.on(LivekitClient.RoomEvent.Disconnected, resetUI);

    status.textContent = 'Conectando con ANTONIA...';
    await room.connect(data.url, data.token);
    await room.localParticipant.setMicrophoneEnabled(true, {
      noiseSuppression: true,
      echoCancellation: true,
      autoGainControl: true,
    });

    antoniaActive = true;
    btn.textContent = 'Colgar';
    btn.classList.add('active');
    btn.disabled = false;
    status.textContent = 'Hablando con ANTONIA — habla con normalidad';
  } catch (e) {
    status.textContent = 'No se pudo conectar. Inténtalo de nuevo.';
    btn.textContent = 'Hablar con ANTONIA';
    btn.classList.remove('active');
    btn.disabled = false;
  }
}

function endAntonia() {
  if (antoniaRoom) { antoniaRoom.disconnect(); antoniaRoom = null; }
  resetUI();
}

function resetUI() {
  antoniaActive = false;
  const btn = document.getElementById('voiceBtn');
  const status = document.getElementById('status');
  btn.textContent = 'Hablar con ANTONIA';
  btn.classList.remove('active');
  btn.disabled = false;
  status.style.display = 'none';
  const audioEl = document.getElementById('antoniaAudio');
  if (audioEl) audioEl.remove();
}
</script>
</body>
</html>
