[project]
name = "truco-voice-agent"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "livekit-agents[google]~=1.3",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
