<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Conectar WhatsApp</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ed; --surface:#ffffff; --border:#e2ddd1;
  --text:#221f1a; --text-dim:#6b6455;
  --accent:#25d366; --accent-ink:#0d1f15;
  --code-bg:#eef7f1; --code-text:#1a6b3c; --code-border:#c9e8d5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15140f; --surface:#1e1c17; --border:#332f26;
    --text:#f1ede3; --text-dim:#a49e8c;
    --accent:#2ee878; --accent-ink:#06140b;
    --code-bg:#102019; --code-text:#5be895; --code-border:#1d3b2a;
  }
}
:root[data-theme="dark"]{
  --bg:#15140f; --surface:#1e1c17; --border:#332f26;
  --text:#f1ede3; --text-dim:#a49e8c;
  --accent:#2ee878; --accent-ink:#06140b;
  --code-bg:#102019; --code-text:#5be895; --code-border:#1d3b2a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,Segoe UI,sans-serif; padding:32px;
}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:20px;
  padding:40px; max-width:460px; width:100%;
}
.eyebrow{
  font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--accent);
  font-weight:600; margin-bottom:10px;
}
h1{
  font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:1.5rem;
  margin:0 0 12px; text-wrap:balance; line-height:1.2;
}
p{ color:var(--text-dim); font-size:.92rem; line-height:1.6; margin:0 0 6px; max-width:65ch; }
.numero{ color:var(--text); font-variant-numeric:tabular-nums; font-weight:600; }
button{
  background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px;
  cursor:pointer; font-family:inherit; font-size:1rem; font-weight:600;
  height:48px; padding:0 26px; margin-top:22px; width:100%;
  transition:filter .15s ease;
}
button:hover{ filter:brightness(1.06); }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
#resultado{
  margin-top:20px; padding:14px 16px; border-radius:10px;
  background:var(--code-bg); border:1px solid var(--code-border); color:var(--code-text);
  font-family:ui-monospace,'SFMono-Regular',Consolas,monospace; font-size:.78rem;
  line-height:1.5; white-space:pre-wrap; word-break:break-all; display:none;
}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">TRUCOchat · Embedded Signup</div>
  <h1>Conectar el WhatsApp del negocio</h1>
  <p>Número <span class="numero">+34 681 89 97 93</span> — modo Coexistence: el WhatsApp de tu móvil sigue funcionando igual mientras se conecta también la API.</p>
  <button onclick="launchWhatsAppSignup()">Conectar con Facebook</button>
  <div id="resultado"></div>
</div>

<script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_ES/sdk.js"></script>
<script>
  window.fbAsyncInit = function() {
    FB.init({
      appId: '1400652505506101',
      autoLogAppEvents: true,
      xfbml: true,
      version: 'v21.0'
    });
  };

  window.addEventListener('message', (event) => {
    if (!event.origin.endsWith('facebook.com')) return;
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'WA_EMBEDDED_SIGNUP') {
        mostrar('Evento de WhatsApp recibido:\n' + JSON.stringify(data, null, 2));
      }
    } catch (e) {
      mostrar('Mensaje recibido: ' + event.data);
    }
  });

  function mostrar(texto) {
    const el = document.getElementById('resultado');
    el.style.display = 'block';
    el.textContent += (el.textContent ? '\n\n' : '') + texto;
  }

  const fbLoginCallback = (response) => {
    if (response.authResponse) {
      const code = response.authResponse.code;
      mostrar('CÓDIGO DE AUTORIZACIÓN (cópialo, hace falta para el token):\n' + code);
    } else {
      mostrar('Respuesta sin autorización: ' + JSON.stringify(response, null, 2));
    }
  };

  function launchWhatsAppSignup() {
    FB.login(fbLoginCallback, {
      config_id: '4620035594944576',
      response_type: 'code',
      override_default_response_type: true,
      extras: { setup: {} },
    });
  }
</script>
</body>
</html>
