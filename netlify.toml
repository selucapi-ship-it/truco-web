[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # SUPABASE_URL no es un dato sensible (es la URL pública del proyecto, protegida
  # por RLS igual que la anon key) y aparece intencionadamente en admin/panel.html.
  # Sin esto, el escáner de secretos de Netlify bloquea el build al encontrarla ahí.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# telegram-antonia.js, antonia-vigilancia.js, antonia-resumen-diario.js y
# fiscal-deadline-reminder.js vivían aquí y se movieron a un sitio Netlify
# nuevo ("antonia-jobs", carpeta ../antonia-jobs) el 2026-09-16: el conjunto
# de variables de entorno de este sitio había superado el límite de 4KB que
# AWS Lambda impone a cada función y TODOS los despliegues fallaban, incluso
# cambios de puro HTML. Esas 4 funciones no tienen ninguna dependencia de
# páginas de este sitio (ni frontend las llama, ni webhooks de terceros
# apuntan aquí salvo el de Telegram, reapuntado al nuevo sitio en el mismo
# cambio) — sacarlas les da su propio presupuesto de 4KB sin perder nada.

[functions."email-ia-worker"]
  # Cada 15 minutos revisa la bandeja de cada cliente con "IA para Correo"
  # activa y deja preparada una respuesta en BORRADOR (nunca se envía sola)
  # — ver email-ia-worker.js. Probado a mano el 2026-09-13 invocando la
  # función directamente vía la rama (con el schedule quitado un momento,
  # ver commit eca1098) — funciona de extremo a extremo, aunque el cron
  # en sí no se activará hasta que producción se desbloquee (Netlify no
  # ejecuta funciones programadas mientras el auto-publish siga
  # congelado: confirmado "0 functions actively running in production").
  schedule = "*/15 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    # Cabeceras añadidas tras la auditoría de seguridad del 31 ago 2026 —
    # ninguna de estas cuatro puede romper nada del sitio (no restringen qué
    # recursos externos se cargan). La CSP que sí podría romper algo si está
    # mal escrita (el chat, el pago, la reserva de citas) va aparte, más abajo,
    # y de momento SOLO en modo informe — nunca bloquea nada todavía.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), camera=(), payment=(self)"
    # CSP en modo SOLO INFORME (Report-Only): no bloquea nada, solo avisa en la
    # consola del navegador de cada visitante si algo carga fuera de esta
    # lista — es el primer paso, seguro, antes de plantearse una CSP que sí
    # bloquee de verdad. Lista construida repasando cada script/stylesheet
    # externo real del sitio (Google Fonts, Supabase, el botón de citas de
    # Google Calendar, LiveKit para el agente de voz, Supabase-js y xlsx vía
    # unpkg, Google Tag Manager). 'unsafe-inline' en script-src/style-src
    # porque el sitio entero usa <script>/style="" inline sin nonces — quitarlo
    # sería una migración aparte, no algo para hacer de un tirón hoy.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://calendar.google.com https://cdn.jsdelivr.net https://unpkg.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://calendar.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://oxdopzvbrxdsjvzxmpxy.supabase.co wss://oxdopzvbrxdsjvzxmpxy.supabase.co https://www.google-analytics.com https://www.googletagmanager.com wss://*.livekit.cloud https://*.livekit.cloud; frame-src https://calendar.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://calendar.google.com"

[[redirects]]
  from = "/sectores/clinicas-dentales.html"
  to = "/sectores/clinicas.html"
  status = 301
