[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # SUPABASE_URL no es un dato sensible (es la URL pública del proyecto, protegida
  # por RLS igual que la anon key) y aparece intencionadamente en admin/panel.html.
  # Sin esto, el escáner de secretos de Netlify bloquea el build al encontrarla ahí.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions."fiscal-deadline-reminder"]
  # Una vez por semana basta: solo crea en Google Calendar los eventos de plazo
  # 130/303 que todavía no existan (es idempotente), no manda nada por su cuenta.
  schedule = "0 8 * * 1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/sectores/clinicas-dentales.html"
  to = "/sectores/clinicas.html"
  status = 301
